- type: entity
  parent: PlumbingDeviceBase
  id: PlumbingPump
  name: fluid pump
  description: A menacing electromagnetically-operated fluid pump. Hm.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    drawdepth: FloorObjects
    noRot: true
    sprite: _Goobstation/Structures/Piping/fluid_pipe.rsi
    layers:
    - map: [ "enum.PipeVisualLayers.Pipe" ]
      state: pump1
      rotation: 180 # The real sprite has the inlet north. We want it south.
  - type: Rotatable
  - type: NodeContainer
    nodes:
      inlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
      outlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
  - type: Transform
    noRot: false
  - type: PlumbingPump
