
- type: entity
  abstract: true
  parent: BaseItem
  id: FluidPipeBase
  name: fluid pipe
  description: A steel fluid conduit.
  placement:
    mode: SnapgridCenter
  components:
  - type: Visibility
    layer: 1
  - type: SubFloorHide
  - type: Item
    size: Normal

  - type: Transform
    anchored: true
  - type: Anchorable
  - type: Rotatable
  - type: NodeContainer
  - type: Tag
    tags:
    - Pipe
  - type: StaticPrice
    price: 120
  - type: Physics
    canCollide: false
    bodyType: static
  - type: CollideOnAnchor

  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong # maybe just make this Metallic

  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 120
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

  - type: Sprite
    sprite: Structures/Piping/Atmospherics/pipe.rsi
    drawdepth: ThinPipe
    visible: false
  - type: Appearance

  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/wrench_pickup.ogg
      params:
        volume: -2
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/Items/wrench_drop.ogg
      params:
        volume: -2
  - type: EmitSoundOnLand
    sound:
      collection: PipeDrop

- type: entity
  parent: FluidPipeBase
  id: FluidPipeBend
  suffix: Bend
  components:
  - type: NodeContainer
    nodes:
      pipe:
        !type:PlumbingNode
        nodeGroupID: Pipe
        pipeDirection: SWBend
  - type: Sprite
    layers:
      - map: [ "enum.PipeVisualLayers.Pipe" ]
        state: pipeBend

- type: entity
  parent: FluidPipeBase
  id: FluidPipeTJunction
  suffix: TJunction
  components:
  - type: Transform
    noRot: true
  - type: NodeContainer
    nodes:
      plumbing:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: TSouth
  - type: Sprite
    layers:
    - map: [ "enum.PipeVisualLayers.Pipe" ]
      state: pipeTJunction

- type: entity
  parent: FluidPipeBase
  id: FluidPipeFourway
  suffix: Fourway
  components:
  - type: Transform
    noRot: true
  - type: NodeContainer
    nodes:
      plumbing:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: Fourway
  - type: Sprite
    layers:
    - map: [ "enum.PipeVisualLayers.Pipe" ]
      state: pipeFourway

