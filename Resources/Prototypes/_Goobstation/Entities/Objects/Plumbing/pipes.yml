
- type: entity
  abstract: true
  parent: BaseItem
  id: FluidPipeBase
  name: fluid pipe
  description: A highly efficient pressure-controlled fluid conduit powered by cosmic background radiation.
  placement:
    mode: SnapgridCenter
  components:
  - type: Visibility
    layer: 1
  - type: Item
    size: Normal
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong # maybe just make this Metallic
  - type: Transform
    anchored: true
  - type: SubFloorHide
  - type: CollideOnAnchor
  - type: PipeAppearance
  - type: Anchorable
  - type: Rotatable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 120
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Sprite
    sprite: Structures/Piping/Atmospherics/pipe.rsi
    drawdepth: ThinPipe
    visible: false
  - type: Appearance
  - type: PipeColorVisuals
  - type: NodeContainer
  - type: Tag
    tags:
    - Pipe
  - type: StaticPrice
    price: 120
  - type: Physics
    canCollide: false
    bodyType: static
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/wrench_pickup.ogg
      params:
        volume: -2
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/Items/wrench_drop.ogg
      params:
        volume: -2
  - type: EmitSoundOnLand
    sound:
      collection: PipeDrop

- type: entity
  parent: FluidPipeBase
  id: FluidPipeFourway
  suffix: Fourway
  components:
  - type: Transform
    noRot: true
  - type: NodeContainer
    nodes:
      plumbing:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: Fourway
  - type: Sprite
    layers:
    - state: pipeFourway
      map: [ "enum.PipeVisualLayers.Pipe" ]
